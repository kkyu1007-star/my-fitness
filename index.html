
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>MY FITNESS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f172a;color:#f1f5f9;font-family:Arial,sans-serif;padding-bottom:85px}
header{padding:22px 16px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:25px;margin:0;color:#fff}
h1 span{color:#14d9ad}
small,.muted{color:#94a3b8}
main{padding:10px 16px}
h2{font-size:21px;margin:20px 0 14px}
h3{font-size:16px}
.card{background:#1b2c40;border:1px solid #2b4057;border-radius:17px;padding:17px;margin-bottom:13px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat p{color:#94a3b8;margin:0 0 13px;font-size:14px}
.stat strong{font-size:26px}
button,select,input{font:inherit}
button{border:0;border-radius:10px;padding:11px 15px;background:#14d9ad;color:#06251e;font-weight:bold;cursor:pointer}
button.secondary{background:#30445d;color:white}
button.danger{background:#7f3544;color:white}
input,select{width:100%;background:#0f172a;color:white;border:1px solid #40516a;padding:12px;border-radius:9px;margin:6px 0 13px}
label{font-size:13px;color:#aabbd0}
nav{position:fixed;bottom:0;left:0;right:0;background:#162a40;display:flex;justify-content:space-around;padding:12px 3px;z-index:5}
nav button{background:transparent;color:#9aadc0;padding:8px 5px;font-size:12px}
nav button.active{color:#14d9ad}
.page{display:none}
.page.active{display:block}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.exercise{background:#24384e;padding:13px;border-radius:12px;margin:10px 0}
.setrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.setrow input{margin:4px 0}
canvas{width:100%;height:230px;background:#14263a;border-radius:12px}
.empty{text-align:center;color:#94a3b8;padding:25px}
.day{display:inline-block;margin:3px;padding:9px 12px;background:#30445d;border-radius:8px;color:white}
.day.selected{background:#14d9ad;color:#06251e}
</style>
</head>
<body>

<header>
 <div>
  <h1>MY <span>FITNESS</span></h1>
  <small>나의 운동 계획과 성장 기록</small>
 </div>
 <button class="secondary" onclick="backup()">백업</button>
</header>

<main>

<section id="home" class="page active">
 <h2>오늘의 운동</h2>
 <div class="stats">
  <div class="card stat"><p>오늘 운동 횟수</p><strong id="todayCount">0회</strong></div>
  <div class="card stat"><p>오늘 세트 수</p><strong id="todaySets">0세트</strong></div>
  <div class="card stat"><p>근력 운동</p><strong id="todayStrength">0회</strong></div>
  <div class="card stat"><p>유산소 운동</p><strong id="todayCardio">0회</strong></div>
 </div>
 <h2>오늘 예정된 운동</h2>
 <div class="card" id="todayPlan"></div>
 <h2>최근 운동 기록</h2>
 <div id="recent"></div>
</section>

<section id="plans" class="page">
 <h2>요일별 운동 계획</h2>
 <p class="muted">요일을 선택하고 운동 종목을 저장해.</p>
 <div id="days"></div>
 <div class="card">
  <label>운동 이름</label>
  <input id="planName" placeholder="예: 체스트 프레스">
  <label>운동 종류</label>
  <select id="planType">
   <option value="strength">근력 운동</option>
   <option value="cardio">유산소 운동</option>
  </select>
  <button onclick="addPlan()">운동 추가</button>
 </div>
 <div id="planList"></div>
</section>

<section id="record" class="page">
 <h2>운동 기록하기</h2>
 <div class="card">
  <label>운동 날짜</label>
  <input type="date" id="recordDate">
  <label>운동 종목</label>
  <select id="recordExercise" onchange="renderRecordForm()"></select>
  <div id="recordForm"></div>
  <button style="width:100%" onclick="saveRecord()">운동 기록 저장</button>
 </div>
</section>

<section id="calendar" class="page">
 <h2>운동 기록</h2>
 <div class="card">
  <label>날짜 선택</label>
  <input type="date" id="calendarDate" onchange="showDateRecords()">
 </div>
 <div id="calendarRecords"></div>
</section>

<section id="stats" class="page">
 <h2>운동 통계</h2>
 <div class="card">
  <h3>근력 운동 그래프</h3>
  <label>운동 종목 선택</label>
  <select id="strengthSelect" onchange="drawStrength()"></select>
  <p class="muted">무게 변화 (kg)</p>
  <canvas id="strengthChart"></canvas>
 </div>
 <div class="card">
  <h3>유산소 운동 그래프</h3>
  <label>운동 종목 선택</label>
  <select id="cardioSelect" onchange="drawCardio()"></select>
  <p class="muted">운동 시간 (분)</p>
  <canvas id="cardioChart"></canvas>
 </div>
</section>

</main>

<nav>
 <button class="active" onclick="showPage('home',this)">⌂<br>홈</button>
 <button onclick="showPage('plans',this)">＋<br>운동 계획</button>
 <button onclick="showPage('record',this)">✎<br>운동 기록</button>
 <button onclick="showPage('calendar',this)">▦<br>캘린더</button>
 <button onclick="showPage('stats',this)">▥<br>통계</button>
</nav>

<script>
const $=id=>document.getElementById(id);
const weekdays=['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];

let plans=JSON.parse(localStorage.getItem('mf_plans')||'{}');
let records=JSON.parse(localStorage.getItem('mf_records')||'[]');
let selectedDay=new Date().getDay();

function saveData(){
 localStorage.setItem('mf_plans',JSON.stringify(plans));
 localStorage.setItem('mf_records',JSON.stringify(records));
}

function today(){
 return new Date().toLocaleDateString('en-CA');
}

function showPage(id,btn){
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
 $(id).classList.add('active');
 document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
 if(btn)btn.classList.add('active');
 refresh();
}

function refresh(){
 renderHome();
 renderPlans();
 renderExerciseOptions();
 renderStats();
}

function renderHome(){
 let t=today();
 let r=records.filter(x=>x.date===t);
 $('todayCount').textContent=r.length+'회';
 $('todaySets').textContent=r.reduce((a,x)=>a+x.sets,0)+'세트';
 $('todayStrength').textContent=r.filter(x=>x.type==='strength').length+'회';
 $('todayCardio').textContent=r.filter(x=>x.type==='cardio').length+'회';

 let p=plans[new Date().getDay()]||[];
 $('todayPlan').innerHTML=p.length?p.map(x=>
  `<div class="exercise">${esc(x.name)} · ${x.type==='strength'?'근력':'유산소'}</div>`
 ).join(''):'<div class="empty">오늘 등록된 운동 계획이 없어.</div>';

 $('recent').innerHTML=records.slice().reverse().slice(0,5).map(recordHTML).join('')
 ||'<div class="empty">아직 운동 기록이 없어.</div>';
}

function renderDays(){
 $('days').innerHTML=weekdays.map((d,i)=>
 `<button class="${i===selectedDay?'day selected':'day'}" onclick="selectDay(${i})">${d.slice(0,1)}</button>`
 ).join('');
}

function selectDay(d){
 selectedDay=d;
 renderPlans();
}

function renderPlans(){
 renderDays();
 let p=plans[selectedDay]||[];
 $('planList').innerHTML='<h3>'+weekdays[selectedDay]+' 운동</h3>'+
 (p.length?p.map((x,i)=>`
 <div class="card row">
 <div><b>${esc(x.name)}</b><br><small>${x.type==='strength'?'근력 운동':'유산소 운동'}</small></div>
 <button class="danger" onclick="deletePlan(${i})">삭제</button>
 </div>`).join(''):'<div class="empty">등록된 운동이 없어.</div>');
}

function addPlan(){
 let name=$('planName').value.trim();
 if(!name)return alert('운동 이름을 입력해줘.');
 if(!plans[selectedDay])plans[selectedDay]=[];
 plans[selectedDay].push({name,type:$('planType').value});
 $('planName').value='';
 saveData();refresh();
}

function deletePlan(i){
 plans[selectedDay].splice(i,1);
 saveData();refresh();
}

function allExercises(){
 let list=[];
 Object.values(plans).forEach(a=>list.push(...a));
 records.forEach(r=>list.push({name:r.name,type:r.type}));
 let map={};
 list.forEach(x=>map[x.name+'_'+x.type]=x);
 return Object.values(map);
}

function renderExerciseOptions(){
 let all=allExercises();
 let select=$('recordExercise');
 let old=select.value;
 select.innerHTML=all.map(x=>
 `<option value="${esc(x.name)}|${x.type}">${esc(x.name)} (${x.type==='strength'?'근력':'유산소'})</option>`
 ).join('');
 if(old)select.value=old;
 renderRecordForm();
}

function renderRecordForm(){
 let val=$('recordExercise').value;
 if(!val){$('recordForm').innerHTML='<p class="muted">먼저 운동 계획에서 종목을 추가해줘.</p>';return;}
 let [name,type]=val.split('|');
 if(type==='cardio'){
  $('recordForm').innerHTML=`
  <label>운동 단계</label>
  <input id="level" type="number" min="1" max="100" placeholder="예: 5">
  <label>운동 시간 (분)</label>
  <input id="minutes" type="number" min="1" placeholder="예: 30">
  <p class="muted">유산소 운동은 세트 1개로 자동 기록돼.</p>`;
 }else{
  $('recordForm').innerHTML=`
  <label>무게 (kg)</label>
  <input id="weight" type="number" min="0" step="0.5" placeholder="예: 50">
  <label>세트 수</label>
  <input id="setCount" type="number" min="1" max="30" value="3" onchange="renderSetInputs()">
  <div id="setInputs"></div>`;
  renderSetInputs();
 }
}

function renderSetInputs(){
 let n=Math.max(1,Math.min(30,Number($('setCount').value)||1));
 $('setInputs').innerHTML='<label>세트별 반복 횟수</label>'+
 Array.from({length:n},(_,i)=>`
 <div class="setrow">
 <label>세트 ${i+1}</label>
 <input class="reps" type="number" min="1" placeholder="반복 횟수">
 </div>`).join('');
}

function saveRecord(){
 let val=$('recordExercise').value;
 if(!val)return alert('운동 종목을 먼저 추가해줘.');
 let [name,type]=val.split('|');
 let r={date:$('recordDate').value||today(),name,type,sets:1};

 if(type==='strength'){
  let weight=Number($('weight').value);
  let reps=[...document.querySelectorAll('.reps')].map(x=>Number(x.value));
  if(!Number.isFinite(weight)||weight<0||reps.some(x=>!Number.isInteger(x)||x<1))
   return alert('무게와 모든 세트의 반복 횟수를 입력해줘.');
  r.weight=weight;
  r.reps=reps;
  r.sets=reps.length;
 }else{
  let level=Number($('level').value);
  let minutes=Number($('minutes').value);
  if(!Number.isInteger(level)||level<1||!Number.isFinite(minutes)||minutes<=0)
   return alert('단계와 운동 시간을 올바르게 입력해줘.');
  r.level=level;
  r.minutes=minutes;
  r.sets=1;
 }
 records.push(r);
 saveData();refresh();
 alert('운동 기록을 저장했어!');
}

function recordHTML(r){
 return `<div class="card">
 <b>${esc(r.name)}</b> <small>${r.date}</small><br>
 ${r.type==='strength'
 ? `${r.weight}kg · ${r.sets}세트 · ${r.reps.join(' / ')}회`
 : `단계 ${r.level} · ${r.minutes}분 · 1세트`}
 </div>`;
}

function showDateRecords(){
 let d=$('calendarDate').value;
 let r=records.filter(x=>x.date===d);
 $('calendarRecords').innerHTML=r.map(recordHTML).join('')
 ||'<div class="empty">해당 날짜의 기록이 없어.</div>';
}

function renderStats(){
 let all=allExercises();
 let strength=all.filter(x=>x.type==='strength');
 let cardio=all.filter(x=>x.type==='cardio');

 function fill(id,items){
  let old=$(id).value;
  $(id).innerHTML=items.map(x=>
   `<option value="${esc(x.name)}">${esc(x.name)}</option>`
  ).join('');
  if(old)$(id).value=old;
 }
 fill('strengthSelect',strength);
 fill('cardioSelect',cardio);
 drawStrength();drawCardio();
}

function drawChart(id,data,color){
 let c=$(id),ctx=c.getContext('2d');
 let w=c.clientWidth,h=230,dpr=window.devicePixelRatio||1;
 c.width=w*dpr;c.height=h*dpr;
 ctx.scale(dpr,dpr);
 ctx.clearRect(0,0,w,h);
 if(!data.length){
  ctx.fillStyle='#94a3b8';ctx.textAlign='center';
  ctx.fillText('아직 기록이 없어',w/2,h/2);
  return;
 }
 let values=data.map(x=>x.value);
 let max=Math.max(...values,1);
 let left=35,right=12,top=20,bottom=35;
 let cw=w-left-right,ch=h-top-bottom;
 ctx.strokeStyle='#40516a';ctx.lineWidth=1;
 for(let i=0;i<5;i++){
  let y=top+ch*i/4;
  ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(w-right,y);ctx.stroke();
 }
 let points=data.map((x,i)=>({
  x:left+(data.length===1?cw/2:cw*i/(data.length-1)),
  y:top+ch-(x.value/max)*ch
 }));
 ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();
 points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
 ctx.stroke();
 points.forEach((p,i)=>{
  ctx.fillStyle=color;ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#94a3b8';ctx.font='10px Arial';ctx.textAlign='center';
  ctx.fillText(data[i].date.slice(5),p.x,h-12);
 });
}

function drawStrength(){
 let name=$('strengthSelect').value;
 let data=records.filter(x=>x.type==='strength'&&x.name===name)
 .sort((a,b)=>a.date.localeCompare(b.date))
 .map(x=>({date:x.date,value:x.weight}));
 drawChart('strengthChart',data,'#14d9ad');
}

function drawCardio(){
 let name=$('cardioSelect').value;
 let data=records.filter(x=>x.type==='cardio'&&x.name===name)
 .sort((a,b)=>a.date.localeCompare(b.date))
 .map(x=>({date:x.date,value:x.minutes}));
 drawChart('cardioChart',data,'#60a5fa');
}

function esc(s){
 return String(s).replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;',
 '"':'&quot;',"'":'&#39;'
 })[c]);
}

function backup(){
 let blob=new Blob([JSON.stringify({plans,records},null,2)],{type:'application/json'});
 let a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='my-fitness-backup.json';
 a.click();
 URL.revokeObjectURL(a.href);
}

$('recordDate').value=today();
$('calendarDate').value=today();
refresh();
showDateRecords();

window.addEventListener('resize',()=>{
 if($('stats').classList.contains('active'))renderStats();
});
</script>
</body>
</html>
